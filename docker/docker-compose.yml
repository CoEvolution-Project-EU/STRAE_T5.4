name: strae

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=prod
      - SECURITY_MIDDLEWARE_ENABLED=true
    ports:
      - "8000:8000"
    command: fastapi run app/main.py --host 0.0.0.0 --port 8000
    volumes:
      - ./secrets:/run/secrets:ro
    profiles:
      - prod
    restart: unless-stopped

  api-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=dev
      - SECURITY_MIDDLEWARE_ENABLED=false
    ports:
      - "8000:8000"
    command: fastapi run app/main.py --reload --host 0.0.0.0 --port 8000
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../code/app:/code/app
      - ./secrets:/run/secrets:ro
    profiles:
      - dev
    restart: unless-stopped
    networks: [strae-net]

  kafka-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - ENVIRONMENT=prod
    command: python -m app.worker
    volumes:
      - ./secrets:/run/secrets:ro
    profiles:
      - kafka
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    profiles:
      - dev
    restart: unless-stopped
    networks: [strae-net]

volumes:
  minio_data:

networks:
  strae-net:
    driver: bridge
    name: strae-net